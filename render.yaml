services:
  - type: web
    name: NAVEED-MD
    env: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    branch: main
    envVars:
      - key: SESSION_ID
        sync: false
      - key: BOT_NAME
        value: NAVEED-MD
      - key: OWNER_NAME
        value: Naveed Ahmed
      - key: PREFIX
        value: .
      - key: MODE
        value: public
